<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>حفظني الكلمات — Save My Words</title>
<meta name="description" content="موقع ذكي لتعلم وحفظ الكلمات في جميع اللغات">
<meta name="theme-color" content="#070a1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a1c;--tx:#eef2ff;--mu:#9aa6d6;--gl:rgba(22,28,72,.62);--bd:rgba(255,255,255,.15);--inb:rgba(5,8,28,.6);--drb:linear-gradient(180deg,#141848,#080a22);--pu:#8b5cf6;--cy:#22d3ee;--gn:#34d399;--rd:#fb7185;--s:1}
[dir=ltr]{--s:-1}
[data-theme=light]{--bg:#eceffd;--tx:#141838;--mu:#56608f;--gl:rgba(255,255,255,.78);--bd:rgba(80,70,160,.25);--inb:rgba(255,255,255,.9);--drb:linear-gradient(180deg,#fff,#e6e9ff)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;font-family:Cairo,"Segoe UI",Tahoma,system-ui,sans-serif;color:var(--tx);background:var(--bg);overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(60% 50% at 12% 8%,rgba(139,92,246,.38),transparent 70%),radial-gradient(50% 45% at 92% 28%,rgba(34,211,238,.22),transparent 70%),radial-gradient(80% 50% at 50% 115%,rgba(59,130,246,.34),transparent 70%),var(--bg)}
.fl{position:absolute;font-weight:900;color:var(--pu);opacity:.3;user-select:none;animation:fl 14s ease-in-out infinite}
@keyframes fl{50%{transform:translate3d(0,-28px,0) rotate(12deg)}}
/* header */
header{position:sticky;top:0;z-index:30;direction:ltr;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px clamp(10px,3vw,28px);background:linear-gradient(var(--gl),transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.brand{justify-self:center;display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;min-width:0}
.brand svg{width:48px;height:38px;filter:drop-shadow(0 0 10px var(--pu));flex:none}
[dir=rtl] .brand span{direction:rtl;text-align:start}
.brand b{display:block;font-size:clamp(1.05rem,2.8vw,1.65rem);font-weight:900;line-height:1.15;white-space:nowrap}
.brand small{display:block;color:var(--mu);font-size:.8rem;white-space:nowrap}
.hr{display:flex;gap:8px}
.lp{display:flex;padding:4px;border-radius:999px;background:var(--gl);border:1px solid var(--bd);box-shadow:0 0 22px -6px var(--pu)}
.lp button{border:0;background:none;font-weight:800;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.2s}
.lp button.on{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 0 18px var(--pu)}
@media(max-width:620px){header{grid-template-columns:auto 1fr auto;grid-template-areas:"l . r" "b b b";row-gap:4px;padding-block:8px}.lp{grid-area:l}.hr{grid-area:r;gap:6px}.brand{grid-area:b}.brand small{display:none}.brand svg{width:38px;height:30px}.lp button{padding:6px 12px;font-size:.88rem}.hr .ib{width:40px;height:40px}}
/* buttons */
.btn,.key,.speak3d{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transform-style:preserve-3d;transition:transform .12s,box-shadow .12s,filter .2s}
.btn{--a:#7c3aed;--b:#0891b2;--d:#4c2fb0;border:0;cursor:pointer;color:#fff;font-weight:800;font-size:1.05rem;padding:14px 24px;border-radius:18px;background:linear-gradient(135deg,var(--b),var(--a));box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 0 var(--d),0 16px 26px -8px var(--a)}
.btn:hover,.key:hover{filter:brightness(1.12)}
.btn:active,.key:active,.speak3d:active{--ty:5px}
.btn:active{box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 1px 0 var(--d),0 6px 12px -6px var(--a)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.good{--a:#059669;--b:#34d399;--d:#047857}.btn.bad{--a:#e11d48;--b:#fb7185;--d:#9f1239}.btn.ghost{--a:#475569;--b:#64748b;--d:#1e293b}
.ib,.chip{border:1px solid var(--bd);background:var(--gl);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);transform:translateY(var(--ty,0px));transition:.12s;backdrop-filter:blur(8px)}
.ib:active,.chip:active{--ty:3px;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.ib{width:44px;height:44px;border-radius:14px;font-size:1.15rem;display:inline-grid;place-items:center;flex:none}
.ib.lg{width:56px;height:56px;font-size:1.5rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;font-weight:700}
.chip.on{background:linear-gradient(135deg,#7c3aed,#3b82f6);border-color:transparent;color:#fff;box-shadow:0 4px 0 #3b1d9e,0 0 22px -2px var(--pu)}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:5px}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;margin-top:18px;padding-bottom:6px}
/* layout */
main{flex:1;width:min(1100px,100%);margin:0 auto;padding:clamp(14px,3vw,30px) clamp(12px,3vw,24px) 40px;position:relative}
.screen{display:none}.screen.on{display:block;animation:in .45s both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}}
.gl{background:var(--gl);border:1px solid var(--bd);border-radius:24px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 26px 50px -22px rgba(0,0,0,.75),0 0 44px -16px var(--pu)}
.lbl{color:var(--mu);font-weight:700}
.mu{color:var(--mu);font-size:.9rem;margin-top:8px}
h2{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:900;margin-bottom:16px;text-shadow:0 0 24px rgba(139,92,246,.6)}
h3{font-weight:800;margin-bottom:8px}
/* home */
.hero{text-align:center;padding:12px 0 26px;position:relative;z-index:1}
.hero h1{font-size:clamp(2.1rem,7vw,4rem);font-weight:900;line-height:1.25;text-shadow:0 0 34px rgba(139,92,246,.75),0 4px 0 rgba(0,0,0,.3)}
.hero h1::after{content:"";display:block;width:min(210px,45%);height:5px;border-radius:9px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--pu),var(--cy),transparent);box-shadow:0 0 16px var(--pu)}
.hero p{margin-top:14px;font-size:clamp(1rem,2.4vw,1.3rem);color:var(--mu)}
.scene{position:absolute;top:-4px;width:230px;height:200px;perspective:900px;pointer-events:none;display:none}
.scL{inset-inline-start:-6px;padding:36px 0 0 30px}.scR{inset-inline-end:10px}
@media(min-width:1000px){.scene{display:block}}
.book{position:relative;width:150px;height:100px;margin-top:10px;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-24deg);animation:bk 7s ease-in-out infinite}
@keyframes bk{50%{transform:rotateX(50deg) rotateZ(-12deg) translateZ(28px)}}
.book::before{content:"";position:absolute;inset:-9px;border-radius:14px;background:linear-gradient(135deg,#4f2bd8,#22d3ee);transform:translateZ(-12px);box-shadow:0 30px 40px rgba(0,0,0,.6),0 0 50px rgba(139,92,246,.75)}
.book b{position:absolute;top:0;width:50%;height:100%;background:repeating-linear-gradient(transparent 0 14px,rgba(80,90,200,.35) 14px 16px),linear-gradient(120deg,#fff,#cfd8ff)}
.book b:first-child{left:0;border-radius:8px 0 0 8px;transform-origin:100% 50%;transform:rotateY(16deg)}
.book b:last-child{right:0;border-radius:0 8px 8px 0;transform-origin:0 50%;transform:rotateY(-16deg)}
.cube{position:absolute;width:var(--z);height:var(--z);transform-style:preserve-3d;animation:cs 18s linear infinite}
@keyframes cs{to{transform:rotateX(360deg) rotateY(360deg)}}
.cube i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:calc(var(--z)*.5);color:#fff;background:linear-gradient(135deg,rgba(139,92,246,.82),rgba(34,211,238,.6));border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 0 22px rgba(255,255,255,.22)}
#c1{top:6px;inset-inline-start:70px}#c2{top:104px;inset-inline-start:6px}
.addc{padding:clamp(16px,3vw,30px);position:relative;z-index:1}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
@media(max-width:700px){.fg{grid-template-columns:minmax(0,1fr)}}
.fld{display:grid;gap:6px;align-content:start;min-width:0}.fld label{font-weight:700;color:var(--mu)}
.in{display:flex;align-items:center;gap:6px;background:var(--inb);border:1.5px solid var(--bd);border-radius:16px;padding:4px 6px 4px 8px;transition:.2s}
.in:focus-within{border-color:var(--cy);box-shadow:0 0 0 4px rgba(34,211,238,.18),0 0 26px -4px var(--cy)}
.in input,.in textarea{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;font-size:1.15rem;padding:11px 8px;resize:vertical}
.in .ib,.in .chip{box-shadow:none;border-radius:12px}
.in .chip{padding:8px 12px;font-size:.9rem;white-space:nowrap}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.stats span{padding:8px 16px;border-radius:999px;background:var(--gl);border:1px solid var(--bd);font-weight:700}
.stats b{color:var(--cy);font-size:1.15rem;margin-inline-end:6px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:24px;padding-bottom:8px}
@media(max-width:900px){.keys{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.keys{grid-template-columns:repeat(2,1fr)}}
.key{--c1:#3b82f6;--c2:#06b6d4;--d:#1e40af;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 8px 16px;border:0;border-radius:24px;cursor:pointer;color:#fff;font-weight:900;font-size:1.05rem;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 9px 0 var(--d),0 22px 30px -8px var(--c1)}
.key:active{box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 0 var(--d),0 8px 14px -6px var(--c1)}
.key .ic{font-size:2.6rem;line-height:1.2;transform:translateZ(34px);filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.key:nth-child(2){--c1:#f59e0b;--c2:#fb7185;--d:#b45309}.key:nth-child(3){--c1:#8b5cf6;--c2:#d946ef;--d:#5b21b6}.key:nth-child(4){--c1:#0d9488;--c2:#22c55e;--d:#115e59}.key:nth-child(5){--c1:#e11d48;--c2:#f97316;--d:#9f1239}
/* library */
.wr{display:grid;grid-template-columns:1.2fr 1.2fr auto auto;gap:12px;align-items:center;padding:12px 16px;margin-bottom:12px;border-radius:20px}
.wr b{font-size:1.25rem}.wr small{display:block;color:var(--mu)}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18)}.dots i.on{background:var(--gn);box-shadow:0 0 8px var(--gn)}
.wa{display:flex;gap:8px}
@media(max-width:700px){.wr{grid-template-columns:1fr auto}.wr .wm{grid-column:1/-1;order:3}}
.empty{text-align:center;padding:40px 16px;color:var(--mu)}
/* settings */
.sg{padding:18px 20px;margin-bottom:16px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--bd);flex-wrap:wrap}
.st{display:flex;align-items:center;gap:10px}.st b{min-width:3em;text-align:center;font-size:1.2rem}
.tg{width:62px;height:34px;border-radius:99px;border:0;background:#334155;position:relative;cursor:pointer;box-shadow:inset 0 3px 6px rgba(0,0,0,.5)}
.tg i{position:absolute;top:4px;inset-inline-start:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 3px 6px rgba(0,0,0,.4)}
.tg.on{background:linear-gradient(90deg,#7c3aed,#22d3ee)}.tg.on i{inset-inline-start:32px}
/* practice */
.top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pbar{flex:1;height:12px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--pu));box-shadow:0 0 14px var(--cy);transition:width .4s}
.pc{max-width:760px;margin:0 auto;padding:clamp(18px,4vw,38px);text-align:center}
.big{font-size:clamp(1.8rem,6vw,3rem);font-weight:900;margin:8px 0 14px;text-shadow:0 0 24px rgba(139,92,246,.7)}
.rv{display:none;margin-top:6px;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}.rv.on{display:flex;animation:in .35s both}
.rv .big{margin:0;color:var(--cy)}
.speak3d{width:116px;height:116px;border-radius:50%;border:0;cursor:pointer;font-size:3rem;color:#fff;margin:10px auto;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#67e8f9,#8b5cf6 70%);box-shadow:0 9px 0 #4c2fb0,0 24px 40px -8px var(--pu),inset 0 -8px 16px rgba(0,0,0,.25)}
.speak3d:active{box-shadow:0 2px 0 #4c2fb0,0 8px 16px -6px var(--pu)}
.mask{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;margin:6px 0 18px}
.bx{width:clamp(34px,9vw,48px);height:clamp(42px,11vw,58px);display:grid;place-items:center;font-size:1.7rem;font-weight:800;border-radius:12px;background:linear-gradient(160deg,rgba(139,92,246,.55),rgba(34,211,238,.3));border:1px solid var(--bd);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.bx.h{background:var(--inb);border:2px dashed var(--cy);box-shadow:0 0 16px -4px var(--cy);color:var(--cy)}
.sp{width:16px}
.pc .in{margin-top:12px}.pc .in input{text-align:center;font-size:1.4rem}
.fb{margin:18px auto 0;padding:14px;border-radius:18px;font-weight:800;max-width:520px}
.fb.good{background:rgba(52,211,153,.16);border:1px solid var(--gn)}.fb.bad{background:rgba(251,113,133,.16);border:1px solid var(--rd)}
.ans{font-size:1.9rem;font-weight:900;margin-top:4px}
.ring{--p:0;width:170px;height:170px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--cy) calc(var(--p)*1%),rgba(255,255,255,.12) 0);box-shadow:0 0 40px -6px var(--pu)}
.ring b{width:136px;height:136px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;font-weight:900;background:var(--bg)}
/* drawer */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,5,20,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.dr{position:fixed;z-index:50;top:0;bottom:0;inset-inline-start:0;width:clamp(310px,25vw,430px);max-width:88vw;transform:translateX(calc(var(--s)*100%));visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--drb);border-inline-end:1px solid var(--bd);box-shadow:0 0 60px rgba(0,0,0,.6);overflow-y:auto}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .dr{transform:none;visibility:visible;transition-delay:0s}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:1.3rem;font-weight:900;margin-bottom:6px}
.di{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:1px solid var(--bd);background:var(--gl);cursor:pointer;font-weight:800;font-size:1.05rem;text-align:start;box-shadow:0 5px 0 rgba(0,0,0,.35);transform:translateY(var(--ty,0px));transition:.12s}
.di:active{--ty:4px;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.di.cur{border-color:var(--cy);box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 22px -4px var(--cy)}
.di.hot{background:linear-gradient(135deg,#7c3aed,#0891b2);color:#fff;border-color:transparent}
.dic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:rgba(255,255,255,.12);flex:none}
/* misc */
.md{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(3,5,20,.7);backdrop-filter:blur(4px)}
.mc{width:min(520px,100%);padding:22px;background:var(--drb)}
#toast{position:fixed;inset-inline:0;bottom:24px;margin:auto;width:max-content;max-width:92vw;z-index:70;display:flex;gap:12px;align-items:center;padding:12px 20px;border-radius:999px;background:var(--drb);border:1px solid var(--cy);font-weight:700;box-shadow:0 0 30px -6px var(--cy);opacity:0;transform:translateY(20px);pointer-events:none;transition:.3s}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast button{border:0;background:var(--cy);color:#04122b;font-weight:800;border-radius:99px;padding:5px 14px;cursor:pointer}
footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px clamp(12px,3vw,28px);border-top:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(10px);font-size:.92rem}
footer .dev{font-weight:800}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gn);box-shadow:0 0 10px var(--gn);margin-inline-end:8px}.dot.off{background:var(--rd);box-shadow:0 0 10px var(--rd)}
@media(max-width:700px){footer{justify-content:center;text-align:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Responsive dashboard + dedicated tool pages */
html,body{width:100%;height:100%;min-height:0;overflow:hidden;overscroll-behavior:none}
body{height:100dvh}
main{flex:1;height:auto;min-height:0;padding:clamp(8px,1.5vw,18px);overflow:hidden;display:flex;flex-direction:column}
.screen{display:none;min-height:0;height:100%;overflow:hidden;overscroll-behavior:contain;padding:4px}
.screen.on{display:block}
#home.screen.on{display:flex;flex-direction:column;overflow:hidden}
#library.screen.on,#settings.screen.on{overflow:auto}
.dashHero{padding:clamp(4px,1vh,12px) 0 clamp(8px,1.5vh,18px);flex:none}
.dashHero h1{font-size:clamp(1.45rem,3.8vw,2.8rem)}.dashHero p{font-size:clamp(.78rem,1.5vw,1rem);margin-top:5px}
.dashboard{flex:1;min-height:0;margin:0;padding:clamp(4px,1vw,12px);grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(7px,1.2vw,14px)}
.dashboard .key{min-height:0;padding:clamp(7px,1.4vh,16px) 6px;gap:clamp(2px,.7vh,7px);justify-content:center;border-radius:clamp(12px,2vw,22px);font-size:clamp(.76rem,1.3vw,1rem);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 5px 0 var(--d),0 12px 18px -8px var(--c1)}
.dashboard .key .ic{font-size:clamp(1.25rem,3vw,2.35rem)}
.dashboard .key small{font-size:clamp(.58rem,1vw,.78rem);font-weight:600;opacity:.9}
.excelTile{--c1:#168447!important;--c2:#21a366!important;--d:#0b5b32!important}.aiTile{--c1:#2563eb!important;--c2:#06b6d4!important;--d:#1e40af!important}
.excelLogo{display:inline-grid;place-items:center;background:#fff;color:#168447;border-radius:7px;font-weight:1000;font-family:Arial,sans-serif;width:1.5em;height:1.5em;font-size:1.05em!important;box-shadow:0 2px 6px #0004}
.inlineX{vertical-align:middle;margin-inline-end:8px}
.screenHead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.screenHead h2{margin:0;font-size:clamp(1.2rem,3vw,2rem)}
.addScreen .addc{margin:0 auto;max-width:900px}.addScreen .stats{justify-content:center}
.toolScreen{flex-direction:column;align-items:center;justify-content:flex-start;gap:12px}.toolScreen.on{display:flex}
.toolCard{width:min(760px,100%);padding:clamp(14px,3vw,26px);display:grid;gap:14px}

   const before=words.length;const result=add(word,meaning,lang);if(result===1)added++;else skipped++;
  });
  if(added){save();renderAll();status.textContent=`تم استيراد ${added} كلمة بنجاح. تم تخطي ${skipped} صف فارغ أو مكرر.`;toast(`تم استيراد ${added} كلمة`)}else status.textContent='لم تتم إضافة كلمات. تأكد أن العمود الأول عربي والثاني إنجليزي وأن الصفوف تحتوي على كلمتين.';
 }catch(err){status.textContent=err.message||'حدث خطأ أثناء قراءة الملف.';}
 e.target.value='';
});

/* ---------- no-scroll engine: paging + auto-fit ---------- */
const libS={items:[],p:0},aiS={items:[],p:0,act:null};
function pageFit(box,pg,st){const n=st.items.length;let per=Math.max(1,n);
 const draw=()=>{const N=Math.max(1,Math.ceil(n/per));st.p=Math.min(Math.max(0,st.p),N-1);box.innerHTML=st.items.slice(st.p*per,st.p*per+per).join('')};
 const over=()=>{const c=box.lastElementChild;return c&&c.getBoundingClientRect().bottom>box.getBoundingClientRect().bottom+1};
 if(n){const k=Math.min(n,6);box.innerHTML=st.items.slice(0,k).join('');const h=[...box.children].reduce((a,e)=>a+e.getBoundingClientRect().height+8,0)/k;per=Math.max(1,Math.floor(box.clientHeight/h));draw();while(per>1&&over()){per--;draw()}}else box.innerHTML='';
 const N=Math.max(1,Math.ceil(n/per));
 pg.innerHTML=(N>1?`<button class="btn ghost" data-pg="-1" ${st.p<=0?'disabled':''}>${t('prev')}</button><span>${st.p+1} / ${N}</span><button class="btn ghost" data-pg="1" ${st.p>=N-1?'disabled':''}>${t('next')}</button>`:'')+(st.act?`<button class="btn good" data-pa="1">${st.act.l}</button>`:'')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pg],[data-pa]');if(!b)return;const ai=b.closest('.pg').id==='aiPg',st=ai?aiS:libS;if(b.dataset.pa){st.act&&st.act.fn();return}st.p+=+b.dataset.pg;ai?aiDraw():renderLib()});
['add','excel','settings','practice','result'].forEach(id=>{const s=$('#'+id),w=document.createElement('div');w.className='fitw';while(s.firstChild)w.append(s.firstChild);s.append(w)});
let fq;function fitScreen(){cancelAnimationFrame(fq);fq=requestAnimationFrame(()=>{const s=document.querySelector('.screen.on'),w=s&&s.querySelector(':scope>.fitw');if(!w)return;let z=1;w.style.zoom=1;while(w.getBoundingClientRect().height>s.clientHeight-4&&z>.4){z-=.04;w.style.zoom=z.toFixed(2)}})}
new MutationObserver(fitScreen).observe($('main'),{childList:true,subtree:true,characterData:true});
addEventListener('resize',()=>{if($('#library').classList.contains('on'))renderLib();aiDraw();fitScreen()});
/* ---------- AI assistant: knowledge base (offline) + online translation/examples ---------- */
const STOP=new Set('ما ماذا هو هي ايه إيه اية يعني معنى معني كلمة كلمه الكلمة الكلمه كلمات ازاي إزاي كيف احفظ أحفظ احفظها حفظ طريقة طريقه لي ليا لو سمحت ممكن عايز عاوز أريد اريد اديني هات هاتلي مثال امثلة أمثلة جملة جمل ترجم ترجمة ترجملي دي دى ده دا دول بالعربي بالانجليزي بالإنجليزي في من علي على the word words meaning of what is does mean how to memorize remember translate translation example examples sentence sentences give me please can you in for a an'.split(' '));
const AIK={ex:/مثال|امثل|أمثل|جمل[ةه]|جمل\b|example|sentence/i,how:/احفظ|أحفظ|حفظ|طريق[ةه]|اتذكر|أتذكر|تذكر|memori[sz]|remember|trick/i};
const tip=h=>`<div class="aiRow pi"><div dir="auto">${h}</div></div>`;
const row=(a,b,l)=>`<div class="aiRow pi"><div><b dir="auto">${esc(a)}</b><div class="mu" dir="auto" style="margin:2px 0 0">${esc(b)}</div></div><button class="ib" data-sp="${esc(a)}" data-sl="${l}" aria-label="${t('listen')}">🔊</button></div>`;
const aiHelp=()=>['🔎 <b>معنى كلمة:</b> اكتب مثلًا «معنى magnifique» أو «يعني ايه bonjour»','🧠 <b>طريقة حفظ:</b> «ازاي احفظ merci»','💬 <b>أمثلة:</b> «أمثلة على bonjour» (محتاج إنترنت)','🌐 <b>ترجمة:</b> «ترجم صباح الخير»','📚 <b>كلمات كتير:</b> اكتب كذا كلمة وبينهم فاصلة أو سطر جديد، وأضيفها لمكتبتك مرة واحدة'].map(tip);
function aiParse(q){const Q=[...q.matchAll(/["“«‘](.+?)["”»’]/g)].map(m=>m[1].trim());let g=Q.length?Q:q.split(/[\n,،;؛|]+/).map(x=>x.split(/\s+/).map(y=>y.replace(/[?؟!.:]+$/,'')).filter(y=>y&&!STOP.has(y.toLowerCase())).join(' ')).filter(Boolean);if(g.length===1&&/كلمات|words|دول/i.test(q)&&g[0].includes(' '))g=g[0].split(' ');return g.slice(0,30)}
const aiFind=q=>{const n=nm(q);return words.find(w=>w.l===lang&&(nm(w.w)===n||nm(w.m)===n))||words.find(w=>nm(w.w)===n||nm(w.m)===n)};
const aiDir=q=>{const f=isAr(q)?'ar':lang;return[f,f==='ar'?(lang==='ar'?'en':lang):'ar']};
const isAr=x=>/[\u0600-\u06FF]/.test(x);
async function aiLookup(q){const f=aiFind(q);if(f)return{w:f.w,m:f.m,l:f.l,own:1};const[a,b]=aiDir(q),o=await tr(q,a,b);return a==='ar'?{w:o,m:q,l:lang}:{w:q,m:o,l:lang}}
const aiAdd=rs=>{const nw=rs.filter(r=>!r.own&&!r.x);return nw.length?{l:`＋ أضف ${nw.length>1?nw.length+' كلمات':'الكلمة'} لمكتبتي`,fn:()=>{let n=0;nw.forEach(r=>{if(add(r.w,r.m,r.l)===1)n++});save();renderAll();toast(t('bulkDone',{n}));aiS.act=null;aiDraw()}}:null};
async function aiEx(q){const own=words.filter(w=>nm(w.w).includes(nm(q))||nm(w.m).includes(nm(q))).slice(0,2).map(w=>row(w.w,w.m,w.l)),[a,b]=aiDir(q),r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+a+'|'+b),j=await r.json(),seen=new Set(),out=[];
 (j.matches||[]).forEach(m=>{const x=dec(m.segment||''),y=dec(m.translation||''),k=nm(x);if(x.length>q.length+8&&x.length<140&&k.includes(nm(q))&&!seen.has(k)){seen.add(k);out.push(row(x,y,a))}});
 const res=own.concat(out.slice(0,6));if(!res.length)throw 0;return res}
async function aiHow(q){let w=q,m='';if(q){try{const r=await aiLookup(q);w=r.w;m=r.m}catch(e){}}
 if(!w)return['⏱ كلمات قليلة كل يوم أحسن من كتير مرة واحدة','🔁 راجع الكلمة بعد يوم، ثم 3 أيام، ثم أسبوع، ثم شهر','✍️ اسمعها، قلها بصوت عالي، واكتبها من غير ما تبص','🖼 اربط كل كلمة بصورة أو موقف من حياتك'].map(tip);
 const V='aeiouyàâäéèêëîïôöùûüœ',sy=(w.match(new RegExp(`[^${V}\\s]*[${V}]+(?:[^${V}\\s]+(?![${V}]))?`,'gi'))||[]);
 const T=[`🔊 اسمع <b dir="auto">${esc(w)}</b> وكررها 3 مرات بصوت عالي`];
 if(m)T.push(`🖼 تخيل صورة أو موقف يخلي «${esc(m)}» مرتبط بشكل الكلمة وصوتها`);
 if(sy.length>1)T.push(`✂️ قسّمها لمقاطع: <b dir="ltr">${esc(sy.join(' · '))}</b>`);
 T.push('✍️ اكتبها 3 مرات من غير ما تبص، وبعدين قارن','💬 استعملها في جملة من عندك النهارده','🔁 راجعها بعد يوم، ثم 3 أيام، ثم أسبوع');return T.map(tip)}
function aiSet(items,act){aiS.items=items;aiS.act=act||null;aiS.p=0;aiDraw()}
function aiDraw(){if($('#ai').classList.contains('on'))pageFit($('#aiBox'),$('#aiPg'),aiS)}
async function aiAsk(q){q=q.trim();if(!q)return;aiSet([tip('⏳ لحظة…')]);
 try{const g=aiParse(q),f=g[0]||'';let it,act=null;
  if(AIK.ex.test(q)){if(!f)throw 'need';it=await aiEx(f)}
  else if(AIK.how.test(q))it=await aiHow(f);
  else if(g.length>1){const rs=[];for(const x of g){try{rs.push(await aiLookup(x))}catch(e){rs.push({w:x,m:'—',l:lang,x:1})}}it=rs.map(r=>row(r.w,r.m,r.l));act=aiAdd(rs)}
  else if(f){const r=await aiLookup(f);it=[row(r.w,r.m,r.l)];act=aiAdd([r])}
  else it=aiHelp();
  aiSet(it,act)}
 catch(e){aiSet([tip(e==='need'?'اكتب الكلمة اللي عايز لها أمثلة.':'مقدرتش أجيب إجابة دلوقتي. الترجمة والأمثلة محتاجين إنترنت، جرّب تاني أو اكتب الكلمة بشكل مختلف.')])}}
$('#aiGo').onclick=()=>aiAsk($('#aiQ').value);$('#aiQ').onkeydown=e=>{if(e.key==='Enter')aiAsk($('#aiQ').value)};
